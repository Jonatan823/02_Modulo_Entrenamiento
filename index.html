<!-- MODAL DE PAGO Y CAPTURA DE DATOS (Nivel 3 en adelante) -->
  <div id="modal-pago" class="hidden-screen fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-yellow-500/40 rounded-2xl p-6 max-w-lg w-full text-center shadow-2xl space-y-4">
      <div class="inline-block bg-yellow-500/10 text-yellow-400 border border-yellow-500/30 font-bold px-3 py-1 rounded-full text-xs uppercase tracking-widest">
        Acceso Completo Pro — $1 USD
      </div>
      <h3 class="text-2xl font-black text-white">Desbloquea el Nivel 3 y Avanzados</h3>
      <p class="text-slate-300 text-xs leading-relaxed">
        Has completado los niveles gratuitos. Completa tus datos para registrar el pago por Mercado Pago y recibir tu PIN de acceso automático.
      </p>

      <!-- Formulario de datos para el pago y aviso -->
      <div class="bg-slate-800 p-4 rounded-lg border border-slate-700 text-left space-y-3">
        <label class="block text-xs font-bold text-slate-300 uppercase">Tus Datos para la Licencia:</label>
        <input type="text" id="pago-nombre" placeholder="Nombre y Apellido" class="w-full px-3 py-2 rounded bg-slate-700 text-white border border-slate-600 text-xs" />
        <input type="email" id="pago-email" placeholder="Correo electrónico para recibir el PIN" class="w-full px-3 py-2 rounded bg-slate-700 text-white border border-slate-600 text-xs" />
        
        <div class="pt-2">
          <label class="block text-xs font-bold text-slate-300 uppercase mb-1">¿Ya tienes tu PIN de activación?</label>
          <div class="flex gap-2">
            <input type="text" id="input-pin-pago" placeholder="Ingresa tu PIN recibido" class="flex-1 px-3 py-2 rounded bg-slate-700 text-white border border-slate-600 text-xs font-mono" />
            <button onclick="canjearPinPago()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-4 py-2 rounded text-xs">Validar PIN</button>
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-2 pt-2">
        <!-- Enlace apuntando a tu link real de Mercado Pago y disparando el aviso por EmailJS -->
        <a href="https://mpago.li/1uHvu2d" target="_blank" onclick="registrarSolicitudPago()" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-3 rounded-lg text-sm transition shadow flex items-center justify-center gap-2">
          💳 PAGAR CON MERCADO PAGO ($1 USD)
        </a>
        <button onclick="cerrarModalPago()" class="text-slate-400 hover:text-white text-xs underline py-1">
          Volver a los niveles gratuitos (1 y 2)
        </button>
      </div>
    </div>
  </div>
