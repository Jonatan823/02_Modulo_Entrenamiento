<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLER - Módulo de Entrenamiento</title>
  <!-- Tailwind CSS para la estructura general -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0f172a;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    #render {
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      overflow: hidden;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4">

  <!-- ENCABEZADO -->
  <header class="bg-slate-900 text-white p-4 rounded-xl flex flex-wrap justify-between items-center shadow-lg border border-slate-800">
    <div id="titulo-ejercicio" class="text-xl font-bold tracking-wider text-amber-400">
      NIVEL / EJERCICIO
    </div>
    <div class="flex items-center gap-4">
      <button id="btn-soporte" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded text-sm font-medium border border-slate-700">Soporte Mail</button>
      <div class="flex items-center gap-2">
        <span class="text-sm text-slate-400">Ejercicio Actual:</span>
        <select id="select-ejercicio" class="bg-slate-800 text-amber-300 font-bold px-3 py-1 rounded border border-slate-700 outline-none cursor-pointer">
          <!-- Opciones cargadas dinámicamente -->
        </select>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-sm text-slate-400">Mapa de Avance:</span>
        <select id="select-mapa" class="bg-slate-800 text-emerald-400 font-bold px-3 py-1 rounded border border-slate-700 outline-none cursor-pointer">
          <!-- Opciones cargadas dinámicamente -->
        </select>
      </div>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="flex-grow grid grid-cols-1 lg:grid-cols-4 gap-4 my-4">
    
    <!-- ÁREA DE RENDERIZADO SLER (IZQUIERDA / 3 COLUMNAS) -->
    <div class="lg:col-span-3 bg-white rounded-2xl p-8 shadow-2xl flex flex-col justify-center items-center relative overflow-hidden min-h-[400px]">
      <div id="placeholder" class="text-slate-400 text-lg font-medium">Seleccione o inicie un ejercicio</div>
      <div id="render" class="hidden w-full flex flex-col justify-center">
        <!-- Las líneas del ejercicio se inyectan aquí -->
      </div>
    </div>

    <!-- PANEL LATERAL DE MARCAS REGISTRADAS (DERECHA / 1 COLUMNA) -->
    <aside class="bg-slate-900 rounded-2xl p-4 shadow-xl border border-slate-800 flex flex-col">
      <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 border-b border-slate-800 pb-2">Marcas Registradas</h3>
      <div id="lista-marcas" class="flex flex-col gap-2 overflow-y-auto max-h-[380px] pr-1">
        <!-- Las marcas de tiempo se cargan aquí -->
      </div>
    </aside>

  </main>

  <!-- PIE DE PÁGINA / CONTROLES -->
  <footer class="bg-slate-900 p-4 rounded-xl flex justify-between items-center shadow-lg border border-slate-800">
    <div id="cronometro" class="text-4xl font-mono font-bold text-amber-400 bg-black/40 px-6 py-2 rounded-xl border border-slate-800 tracking-widest">
      00:00:00
    </div>
    <button id="btn-accion" class="bg-red-600 hover:bg-red-700 text-white font-bold px-8 py-3 rounded-xl shadow-lg transition-transform active:scale-95 text-lg">
      DETENER
    </button>
  </footer>

  <!-- Script Principal -->
  <script src="main.js"></script>
</body>
</html>
